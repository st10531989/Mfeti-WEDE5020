<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

   <header>

        <h1>Mfeti Electrical Solution</h1>

        <nav>
            <a href="index.html">Home</a> 
            <a href="about.html">About Us</a> 
            <a href="services.html">Services</a> 
            <a href="gallery.html">Gallery</a> 
            <a href="testimonials.html">Testimonials</a> 
            <a href="quote.html">Request a Quote</a> 
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <hr>

    <main>

        <h2>Request a Quote</h2>

        <p>
            Please complete the form below to request an
            electrical service quotation.
        </p>


        <form>

            <p>

                <label for="name">
                    Full Name:
                </label>

                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required>

            </p>


            <p>

                <label for="phone">
                    Phone Number:
                </label>

                <br>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required>

            </p>


            <p>

                <label for="email">
                    Email Address:
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required>

            </p>


            <p>

                <label for="service">
                    Service Required:
                </label>

                <br>

                <select
                    id="service"
                    name="service">

                    <option>
                        Select a service
                    </option>

                    <option>
                        Residential Electrical
                    </option>

                    <option>
                        Commercial Electrical
                    </option>

                    <option>
                        Electrical Installation
                    </option>

                    <option>
                        Electrical Repairs
                    </option>

                    <option>
                        Electrical Maintenance
                    </option>

                    <option>
                        Fault Finding
                    </option>

                </select>

            </p>


            <p>

                <label for="message">
                    Describe the work you need:
                </label>

                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="8"
                    cols="50">
                </textarea>

            </p>


            <p>

                <input
                    type="submit"
                    value="Submit Quote Request">

                <input
                    type="reset"
                    value="Clear Form">

            </p>

        </form>

    </main>

    <hr>

    <footer>

        <p>
            &copy; 2026 Mfeti Electrical Solution
        </p>

    </footer>

</body>

</html>
